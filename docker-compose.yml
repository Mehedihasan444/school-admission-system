services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: admission
      POSTGRES_USER: admission
      POSTGRES_PASSWORD: admission
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admission -d admission"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "${ConnectionStrings__Default:-Host=db;Port=5432;Database=admission;Username=admission;Password=admission;Maximum Pool Size=100;Timeout=30}"
      HOLD_DURATION_SECONDS: "${HOLD_DURATION_SECONDS:-600}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_BASE_URL: "${API_BASE_URL:-http://localhost:8080}"
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Bonus: a second API instance against the same database. Start it with
  # `docker compose --profile multi up --build`; it is not part of the default
  # three-service run.
  backend2:
    profiles: ["multi"]
    build: ./backend
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "${ConnectionStrings__Default:-Host=db;Port=5432;Database=admission;Username=admission;Password=admission;Maximum Pool Size=100;Timeout=30}"
      HOLD_DURATION_SECONDS: "${HOLD_DURATION_SECONDS:-600}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8081}"
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
