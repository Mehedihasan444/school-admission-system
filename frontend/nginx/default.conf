server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # config.js is regenerated at container start from the API_BASE_URL env;
    # browsers must always fetch the fresh value.
    location = /config.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
